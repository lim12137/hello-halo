name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare product.json
        shell: pwsh
        run: |
          if (-not (Test-Path "product.json")) {
            if (Test-Path "product.example.json") {
              Copy-Item "product.example.json" "product.json"
              Write-Host "Created product.json from product.example.json"
            } else {
              throw "product.json and product.example.json are both missing"
            }
          } else {
            Write-Host "product.json already exists"
          }

      - name: Build Windows x64 installer (manual, no publish)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/')
        run: npm run build:win-x64

      - name: Build and publish Windows release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: halo-windows-exe
          path: dist/*.exe
          if-no-files-found: error
